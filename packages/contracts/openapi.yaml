openapi: 3.0.3
info:
  title: Qlutch API
  version: 0.1.1-C
  description: |
    在脚手架探针之上扩展新用户流程 A1 身份域，并追加 A4 知识域（知识包、预签名上传、导入受理、作业查询与跳过首包）。
    平台约定见 I03；正文见《新用户流程 A1 身份契约》v0.1.0-C 与《新用户流程 A4 知识包与导入受理契约》v0.1.1-C。
    不改 A1 已锁的身份路径与 schema 定义（错误码枚举仅作兼容追加）。
    不包含内部后管 API，不包含抖音 / B 站入口，不包含 S02 出题或 worker 内部接口。
servers:
  - url: http://127.0.0.1:4710
    description: 本地 API
tags:
  - name: Health
  - name: Identity
  - name: Knowledge
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: 进程存活
      security: []
      responses:
        "200":
          description: 进程正在运行
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReady
      tags: [Health]
      summary: 依赖就绪
      security: []
      responses:
        "200":
          description: 依赖可达
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: 依赖不可达
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /v1/identity/otp/send:
    post:
      operationId: sendIdentityOtp
      tags: [Identity]
      summary: 请求短信验证码
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "200":
          description: 已受理发码（含幂等重放的相同结果）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/identity/otp/verify:
    post:
      operationId: verifyIdentityOtp
      tags: [Identity]
      summary: 校验验证码并建会话
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: 校验成功，返回会话与下一步
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/identity/session/refresh:
    post:
      operationId: refreshIdentitySession
      tags: [Identity]
      summary: 刷新会话
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRefreshRequest"
      responses:
        "200":
          description: 已签发新令牌
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/identity/session/revoke:
    post:
      operationId: revokeIdentitySession
      tags: [Identity]
      summary: 吊销当前会话
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "204":
          description: 已吊销或本已失效
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/identity/onboarding:
    get:
      operationId: getIdentityOnboarding
      tags: [Identity]
      summary: 读取建档 7 步进度
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 当前进度
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
    put:
      operationId: putIdentityOnboarding
      tags: [Identity]
      summary: 写入当前建档步
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingWriteRequest"
      responses:
        "200":
          description: 写入后的进度
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/identity/profile:
    get:
      operationId: getIdentityProfile
      tags: [Identity]
      summary: 读取语言与区号偏好
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 当前偏好
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProfile"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
    put:
      operationId: putIdentityProfile
      tags: [Identity]
      summary: 更新语言与区号偏好
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProfileUpdate"
      responses:
        "200":
          description: 更新后的偏好
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProfile"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/knowledge/packs:
    post:
      operationId: createKnowledgePack
      tags: [Knowledge]
      summary: 创建空知识包
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePackCreateRequest"
      responses:
        "201":
          description: 已创建空知识包
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/knowledge/materials/upload-url:
    post:
      operationId: createKnowledgeMaterialUploadUrl
      tags: [Knowledge]
      summary: 申请材料预签名上传
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUploadUrlRequest"
      responses:
        "200":
          description: 已签发预签名上传地址
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialUploadUrlResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/knowledge/imports:
    post:
      operationId: createKnowledgeImport
      tags: [Knowledge]
      summary: 提交导入并入队
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: 已受理导入（含幂等重放）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeJob"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/knowledge/jobs/{id}:
    get:
      operationId: getKnowledgeJob
      tags: [Knowledge]
      summary: 查询导入作业
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 当前作业
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeJob"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
  /v1/knowledge/first-pack/skip:
    post:
      operationId: skipKnowledgeFirstPack
      tags: [Knowledge]
      summary: 跳过首包（我没有材料）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstPackSkipRequest"
      responses:
        "200":
          description: 首包步骤已完成（含幂等重放或已完成后再跳过）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstPackSkipResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
  headers:
    XRequestId:
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    ReadyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    RegionCode:
      type: string
      enum: ["+86", "+852"]
    Locale:
      type: string
      enum: [zh-Hans, zh-Hant]
    OtpPurpose:
      type: string
      enum: [register, login]
    NextStep:
      type: string
      enum: [NEED_ONBOARDING, NEED_FIRST_PACK, READY_HOME]
    StepId:
      type: string
      enum: [nickname, age, study_or_work, identity, how_to_address, exam_track, daily_time]
    OtpSendRequest:
      type: object
      additionalProperties: false
      required: [region_code, phone_national, purpose]
      properties:
        region_code:
          $ref: "#/components/schemas/RegionCode"
        phone_national:
          type: string
          pattern: "^[0-9]+$"
          minLength: 1
        purpose:
          $ref: "#/components/schemas/OtpPurpose"
        locale:
          $ref: "#/components/schemas/Locale"
    OtpSendResponse:
      type: object
      additionalProperties: false
      required: [retry_after_seconds]
      properties:
        retry_after_seconds:
          type: integer
          minimum: 0
        destination_hint:
          type: string
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [region_code, phone_national, purpose, code]
      properties:
        region_code:
          $ref: "#/components/schemas/RegionCode"
        phone_national:
          type: string
          pattern: "^[0-9]+$"
          minLength: 1
        purpose:
          $ref: "#/components/schemas/OtpPurpose"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        locale:
          $ref: "#/components/schemas/Locale"
    SessionRefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    SessionRevokeRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
    AccountSummary:
      type: object
      additionalProperties: false
      required: [user_id, is_new_user, onboarding_completed, has_first_pack]
      properties:
        user_id:
          type: string
          minLength: 1
        is_new_user:
          type: boolean
        onboarding_completed:
          type: boolean
        has_first_pack:
          type: boolean
    IdentityProfile:
      type: object
      additionalProperties: false
      required: [locale, region_code]
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        region_code:
          $ref: "#/components/schemas/RegionCode"
    IdentityProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        region_code:
          $ref: "#/components/schemas/RegionCode"
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_in, account, next_step, profile]
      properties:
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
        expires_in:
          type: integer
          minimum: 1
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
        profile:
          $ref: "#/components/schemas/IdentityProfile"
    OnboardingStepState:
      type: object
      additionalProperties: false
      required: [step_id, index, status]
      properties:
        step_id:
          $ref: "#/components/schemas/StepId"
        index:
          type: integer
          minimum: 1
          maximum: 7
        status:
          type: string
          enum: [pending, completed]
        answer:
          type: string
          nullable: true
    OnboardingState:
      type: object
      additionalProperties: false
      required: [current_index, completed, steps, account, next_step]
      properties:
        current_step_id:
          type: string
          nullable: true
          enum: [nickname, age, study_or_work, identity, how_to_address, exam_track, daily_time, null]
        current_index:
          type: integer
          minimum: 1
          maximum: 7
        completed:
          type: boolean
        nickname:
          type: string
          nullable: true
        steps:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/OnboardingStepState"
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
    OnboardingWriteRequest:
      type: object
      additionalProperties: false
      required: [step_id]
      properties:
        step_id:
          $ref: "#/components/schemas/StepId"
        nickname:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
    MaterialSource:
      type: string
      enum: [camera, file, paste_note]
    JobStatus:
      type: string
      enum: [accepted, running, map_ready, failed_retryable, failed_terminal]
    KnowledgePackCreateRequest:
      type: object
      additionalProperties: false
      properties: {}
    KnowledgePack:
      type: object
      additionalProperties: false
      required: [pack_id, account, next_step]
      properties:
        pack_id:
          type: string
          minLength: 1
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
    MaterialUploadUrlRequest:
      type: object
      additionalProperties: false
      required: [pack_id, source, content_type, byte_size]
      properties:
        pack_id:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/MaterialSource"
        content_type:
          type: string
          minLength: 1
        byte_size:
          type: integer
          minimum: 1
        filename:
          type: string
          minLength: 1
    MaterialUploadUrlResponse:
      type: object
      additionalProperties: false
      required:
        - material_id
        - pack_id
        - source
        - upload_url
        - upload_method
        - upload_headers
        - expires_in
        - account
        - next_step
      properties:
        material_id:
          type: string
          minLength: 1
        pack_id:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/MaterialSource"
        upload_url:
          type: string
          minLength: 1
        upload_method:
          type: string
          enum: [PUT]
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_in:
          type: integer
          minimum: 1
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
    ImportRequest:
      type: object
      additionalProperties: false
      required: [pack_id, material_id]
      properties:
        pack_id:
          type: string
          minLength: 1
        material_id:
          type: string
          minLength: 1
    KnowledgeJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - pack_id
        - material_id
        - source
        - status
        - map_ready
        - retryable
        - account
        - next_step
      properties:
        job_id:
          type: string
          minLength: 1
        pack_id:
          type: string
          minLength: 1
        material_id:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/MaterialSource"
        status:
          $ref: "#/components/schemas/JobStatus"
        map_ready:
          type: boolean
        retryable:
          type: boolean
        progress_message:
          type: string
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
    FirstPackSkipRequest:
      type: object
      additionalProperties: false
      properties: {}
    FirstPackSkipResponse:
      type: object
      additionalProperties: false
      required: [account, next_step]
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        next_step:
          $ref: "#/components/schemas/NextStep"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTH_REQUIRED
                - AUTH_EXPIRED
                - AUTH_FORBIDDEN
                - AUTH_WRONG_REALM
                - AUTH_ACCOUNT_NOT_FOUND
                - AUTH_ACCOUNT_EXISTS
                - AUTH_OTP_INVALID
                - AUTH_OTP_EXPIRED
                - AUTH_OTP_MAX_ATTEMPTS
                - VALIDATION_INVALID_PHONE
                - VALIDATION_UNSUPPORTED_REGION
                - VALIDATION_UNSUPPORTED_LOCALE
                - VALIDATION_INVALID_PURPOSE
                - VALIDATION_INVALID_OTP_FORMAT
                - VALIDATION_MISSING_FIELD
                - VALIDATION_NICKNAME
                - VALIDATION_INVALID_STEP
                - VALIDATION_INVALID_STEP_ANSWER
                - VALIDATION_STEP_OUT_OF_ORDER
                - VALIDATION_INVALID_SOURCE
                - VALIDATION_UNSUPPORTED_MEDIA
                - VALIDATION_MEDIA_TOO_LARGE
                - VALIDATION_MATERIAL_NOT_UPLOADED
                - NOT_FOUND
                - CONFLICT
                - IDEMPOTENCY_KEY_MISMATCH
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        request_id:
          type: string
  responses:
    Error400:
      description: 请求不合法
      headers:
