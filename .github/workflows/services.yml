name: services

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/contracts/gen/go/**"
      - "packages/contracts/go.mod"
      - "packages/contracts/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/services.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/contracts/gen/go/**"
      - "packages/contracts/go.mod"
      - "packages/contracts/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Local Compose credentials from infra/local/compose.yaml. Not a production secret.
        image: postgres:18.7
        env:
          POSTGRES_USER: qlutch
          POSTGRES_PASSWORD: qlutch-local-dev
          POSTGRES_DB: qlutch
        ports:
          - 4713:5432
        options: >-
          --health-cmd "pg_isready -U qlutch -d qlutch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QLUTCH_TEST_DATABASE_URL: postgres://qlutch:qlutch-local-dev@127.0.0.1:4713/qlutch?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./services/api/... ./services/worker/... ./services/airuntime/... ./packages/contracts/...
      - run: go test ./services/api/... ./services/worker/... ./services/airuntime/... ./packages/contracts/...
