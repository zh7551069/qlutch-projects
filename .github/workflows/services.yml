name: services

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/contracts/gen/go/**"
      - "packages/contracts/go.mod"
      - "packages/contracts/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/services.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/contracts/gen/go/**"
      - "packages/contracts/go.mod"
      - "packages/contracts/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./services/api/... ./services/worker/... ./services/airuntime/... ./packages/contracts/...
      - run: go test ./services/api/... ./services/worker/... ./services/airuntime/... ./packages/contracts/...
