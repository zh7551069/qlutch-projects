name: contracts

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "tools/codegen/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - "tools/codegen/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - uses: arduino/setup-task@v3
        with:
          version: 3.54.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/codegen/model.test.mjs
      - run: task gen
      - run: git diff --exit-code
